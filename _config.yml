# GitHub Pages Jekyll configuration
title: ABCspareparts
description: MRO industrial spare parts distributor
url: "https://abcspareparts.eu"

# Root static files that must always publish.
# build-brand-parts.js rewrites the listino-sitemaps markers when listini change.
include:
  - robots.txt
  - llms.txt
  - listini-data
  - sitemap.xml
  - sitemap-index.xml
  - sitemap-brands.xml
  - sitemap-brand-parts.xml
  - sitemap-cases.xml
  - sitemap-parts.xml
  - brand-groups.json
  - _redirects
  - seo-config.js
  # BEGIN listino-sitemaps
  - sitemap-siemens-parts-1.xml
  - sitemap-siemens-parts-2.xml
  - sitemap-siemens-parts-3.xml
  # END listino-sitemaps

# Serve sitemap XML without Liquid wrapping (layout: none strips front matter).
defaults:
  - scope:
      path: "sitemap.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-index.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-brands.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-brand-parts.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-cases.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-parts.xml"
    values:
      layout: none
  # BEGIN listino-sitemap-defaults
  - scope:
      path: "sitemap-siemens-parts-1.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-siemens-parts-2.xml"
    values:
      layout: none
  - scope:
      path: "sitemap-siemens-parts-3.xml"
    values:
      layout: none
  # END listino-sitemap-defaults
