name: IndexNow URL Submission

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - '**/*.html'
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'Submit all URLs from sitemap instead of only changed files'
        required: false
        type: boolean
        default: false

jobs:
  submit-to-indexnow:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout current commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Find changed HTML files and submit to IndexNow
        run: |
          set -e
          
          # IndexNow configuration
          INDEXNOW_KEY="358d84ea693dd2169d3c624dfbbc2b17bc1d8d39d3ae3dcb40b7774fd7650a8c"
          SITE_BASE="https://abcspareparts.eu"
          INDEXNOW_ENDPOINT="https://api.indexnow.org/indexnow"
          KEY_LOCATION="${SITE_BASE}/${INDEXNOW_KEY}.txt"
          MAX_BATCH_SIZE=10000
          
          # Function to convert file path to URL
          file_to_url() {
            local file="$1"
            file="${file#./}"
            
            if [ "$file" = "index.html" ]; then
              echo "${SITE_BASE}/"
            elif [[ "$file" =~ ^(en|it|es|fr)/index\.html$ ]]; then
              local lang="${file%%/*}"
              echo "${SITE_BASE}/${lang}/"
            else
              echo "${SITE_BASE}/${file}"
            fi
          }
          
          # Function to check if file should be excluded
          should_exclude() {
            local file="$1"
            [[ "$file" =~ ^listini-data/ ]] || \
            [[ "$file" =~ ^node_modules/ ]] || \
            [[ "$file" =~ /test[^/]*\.html$ ]] || \
            [[ "$file" =~ ^test[^/]*\.html$ ]] || \
            [[ "$file" =~ \.txt$ ]] || \
            [[ "$file" == *"${INDEXNOW_KEY}.txt" ]]
          }
          
          if [ "${{ github.event.inputs.submit_all }}" = "true" ]; then
            echo "🌐 Fetching all URLs from sitemap..."
            
            # Fetch sitemap index
            SITEMAP_INDEX=$(curl -s "${SITE_BASE}/sitemap-index.xml")
            
            # Extract sitemap URLs
            SITEMAP_URLS=$(echo "$SITEMAP_INDEX" | grep -oP '(?<=<loc>)[^<]+' || true)
            
            if [ -z "$SITEMAP_URLS" ]; then
              echo "⚠️  No sitemaps found in sitemap-index.xml"
              exit 0
            fi
            
            echo "📑 Found sitemaps:"
            echo "$SITEMAP_URLS"
            
            # Fetch all URLs from each sitemap
            URLS=""
            while IFS= read -r sitemap_url; do
              [ -z "$sitemap_url" ] && continue
              echo "Fetching: $sitemap_url"
              SITEMAP_CONTENT=$(curl -s "$sitemap_url")
              SITEMAP_LOCS=$(echo "$SITEMAP_CONTENT" | grep -oP '(?<=<loc>)[^<]+' || true)
              URLS="${URLS}${SITEMAP_LOCS}"$'\n'
            done <<< "$SITEMAP_URLS"
            
            URLS=$(echo "$URLS" | grep -v '^$' | sort -u)
          else
            echo "🔍 Finding changed HTML files..."
            
            # Get list of changed HTML files (added, modified, renamed)
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              CHANGED_FILES=$(git diff --name-only --diff-filter=AMR HEAD^ HEAD | grep '\.html$' || true)
            else
              CHANGED_FILES=$(git ls-files '*.html')
            fi
            
            if [ -z "$CHANGED_FILES" ]; then
              echo "ℹ️  No HTML files changed, skipping IndexNow submission"
              exit 0
            fi
            
            echo "📄 Changed HTML files:"
            echo "$CHANGED_FILES"
            
            # Convert file paths to canonical URLs, excluding certain paths
            URLS=""
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              
              if should_exclude "$file"; then
                echo "⊗ Excluding: $file"
                continue
              fi
              
              url=$(file_to_url "$file")
              URLS="${URLS}${url}"$'\n'
            done <<< "$CHANGED_FILES"
            
            URLS=$(echo "$URLS" | grep -v '^$' | sort -u)
          fi
          
          if [ -z "$URLS" ]; then
            echo "ℹ️  No valid URLs to submit"
            exit 0
          fi
          
          echo ""
          echo "🌐 Canonical URLs to submit:"
          echo "$URLS"
          
          # Count URLs
          URL_COUNT=$(echo "$URLS" | wc -l)
          echo ""
          echo "📊 Total URLs: $URL_COUNT"
          
          # Split URLs into batches and submit
          batch_num=1
          echo "$URLS" | split -l "$MAX_BATCH_SIZE" - /tmp/url_batch_
          
          for batch_file in /tmp/url_batch_*; do
            [ ! -f "$batch_file" ] && continue
            
            batch_count=$(wc -l < "$batch_file")
            echo ""
            echo "📤 Submitting batch ${batch_num} (${batch_count} URLs)..."
            
            # Build JSON payload using jq
            json_payload=$(jq -n \
              --arg host "abcspareparts.eu" \
              --arg key "$INDEXNOW_KEY" \
              --arg loc "$KEY_LOCATION" \
              --argjson urls "$(cat "$batch_file" | jq -R . | jq -s .)" \
              '{host:$host,key:$key,keyLocation:$loc,urlList:$urls}')
            
            # Submit to IndexNow
            http_code=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -d "$json_payload" \
              "${INDEXNOW_ENDPOINT}")
            
            if [ "$http_code" = "200" ] || [ "$http_code" = "202" ]; then
              echo "✅ Batch ${batch_num} submitted successfully (HTTP ${http_code})"
            else
              echo "❌ Batch ${batch_num} submission failed (HTTP ${http_code})"
              echo "Response:"
              cat /tmp/indexnow_response.txt
              if [[ "$http_code" =~ ^4 ]]; then
                exit 1
              fi
            fi
            
            batch_num=$((batch_num + 1))
            
            # Rate limiting: wait 1 second between batches
            if [ -f "/tmp/url_batch_$(printf '%02d' $batch_num)" ]; then
              sleep 1
            fi
          done
          
          # Cleanup
          rm -f /tmp/url_batch_* /tmp/indexnow_response.txt
          
          echo ""
          echo "✨ IndexNow submission complete!"
          
      - name: Summary
        if: always()
        run: |
          echo "### IndexNow Submission Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔑 **Key**: \`358d84ea...650a8c\`" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Site**: https://abcspareparts.eu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The IndexNow key file is publicly accessible at:" >> $GITHUB_STEP_SUMMARY
          echo "https://abcspareparts.eu/358d84ea693dd2169d3c624dfbbc2b17bc1d8d39d3ae3dcb40b7774fd7650a8c.txt" >> $GITHUB_STEP_SUMMARY
